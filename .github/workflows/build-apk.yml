name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ChipsNFish.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChipsNFish-apk
          path: ChipsNFish.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChipsNFish.apk \
            --title "Chips&Fish – nejnovější sestavení #${{ github.run_number }}" \
            --notes "Automaticky sestaveno z commitu ${{ github.sha }}. Stáhněte ChipsNFish.apk a nainstalujte do telefonu." \
            --target ${{ github.sha }}
