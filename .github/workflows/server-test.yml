name: Server test

on:
  push:
    branches: [ main ]
    paths: [ 'supabase/**', 'scripts/server-smoke.sh', '.github/workflows/server-test.yml', 'app/src/main/java/com/onoseto/chipsnfish/online/Supa.kt' ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Two players play a hand on the real Supabase server
        run: ./scripts/server-smoke.sh
